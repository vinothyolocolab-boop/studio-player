<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudioScreen AI — Instant Share Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #06080f;
            --bg-surface: #0f1422;
            --bg-elevated: #182032;
            --accent-primary: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(99, 102, 241, 0.4);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(6, 182, 212, 0.08) 50%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        /* Top Header */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .brand-icon svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            border-color: var(--border-subtle);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        }

        .btn-primary:hover {
            opacity: 0.95;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
        }

        /* Main Video Container */
        main {
            width: 100%;
            max-width: 1060px;
            padding: 0 24px;
            margin: auto 0;
            z-index: 10;
        }

        .player-wrapper {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 14px;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.8), 0 0 40px rgba(99, 102, 241, 0.12);
            position: relative;
        }

        .video-box {
            position: relative;
            width: 100%;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #000000;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            outline: none;
        }

        /* Unmute Banner Overlay */
        #unmuteBanner {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            z-index: 20;
            animation: pulseBanner 2s infinite;
        }

        @keyframes pulseBanner {
            0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.7); }
        }

        #unmuteBanner:hover {
            background: rgba(30, 41, 59, 0.95);
            border-color: #6366f1;
        }

        /* Video Info Footer */
        .video-meta-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 18px;
            padding: 4px 8px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .video-title-box h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .video-title-box p {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .meta-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Toast */
        #toast {
            visibility: hidden;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: #ffffff;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 24px;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
        }

        /* Footer */
        footer {
            width: 100%;
            max-width: 1200px;
            padding: 24px 32px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            z-index: 10;
        }

        footer a {
            color: var(--accent-primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <!-- Header -->
    <header>
        <a href="#" class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm8 2.5a.75.75 0 0 0-1.15-.64l-4.5 3a.75.75 0 0 0 0 1.28l4.5 3A.75.75 0 0 0 12 14.5v-6zm3 0a.75.75 0 0 0-1.5 0v6a.75.75 0 0 0 1.5 0v-6z"/></svg>
            </div>
            <span class="brand-name">StudioScreen</span>
        </a>

        <div class="header-actions">
            <button class="btn btn-secondary" id="copyShareBtn">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                Copy Link
            </button>
            <a href="#" id="downloadBtn" class="btn btn-primary" download="StudioScreen_Recording.mp4">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download MP4
            </a>
        </div>
    </header>

    <!-- Main Player Area -->
    <main>
        <div class="player-wrapper">
            <div class="video-box">
                <div id="unmuteBanner">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M11 5L6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
                    <span>Click to Unmute Audio</span>
                </div>

                <video id="player" controls autoplay loop playsinline preload="auto"></video>
            </div>

            <div class="video-meta-bar">
                <div class="video-title-box">
                    <h1 id="videoTitle">StudioScreen Recording</h1>
                    <p id="videoSubtitle">Recorded with zero lag &bull; 60 FPS HD</p>
                </div>
                <div class="meta-actions">
                    <button class="btn btn-secondary" id="speedBtn">1x Speed</button>
                    <button class="btn btn-secondary" id="fullscreenBtn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                        Fullscreen
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast">✓ Link copied to clipboard!</div>

    <!-- Footer -->
    <footer>
        <p>Recorded and shared via <a href="#">StudioScreen</a> &bull; World-Class Screen Recording & AI Customization</p>
    </footer>

    <script>
        (function() {
            const player = document.getElementById('player');
            const unmuteBanner = document.getElementById('unmuteBanner');
            const videoTitle = document.getElementById('videoTitle');
            const downloadBtn = document.getElementById('downloadBtn');
            const copyShareBtn = document.getElementById('copyShareBtn');
            const speedBtn = document.getElementById('speedBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const toast = document.getElementById('toast');

            // Parse URL Query parameters
            const urlParams = new URLSearchParams(window.location.search);
            let videoSrc = urlParams.get('v') || urlParams.get('src') || urlParams.get('url');

            // Fallback to hash if query param wasn't used
            if (!videoSrc && window.location.hash) {
                videoSrc = window.location.hash.substring(1);
            }

            if (urlParams.get('title')) {
                videoTitle.textContent = decodeURIComponent(urlParams.get('title'));
            }

            // Set video source
            if (videoSrc) {
                player.src = videoSrc;
                downloadBtn.href = videoSrc;
            }

            // ==========================================
            // GUARANTEED AUTOPLAY LOGIC
            // ==========================================
            function attemptAutoplay() {
                // Try playing unmuted first
                player.muted = false;
                const promise = player.play();
                if (promise !== undefined) {
                    promise.then(() => {
                        // Unmuted autoplay succeeded
                        unmuteBanner.style.display = 'none';
                    }).catch(error => {
                        // Browser autoplay policy blocked unmuted video:
                        // Start playing MUTED immediately (never block user playback!)
                        console.log("Autoplay blocked by browser policy, fallback to muted autoplay:", error);
                        player.muted = true;
                        player.play().then(() => {
                            unmuteBanner.style.display = 'flex';
                        }).catch(e => {
                            console.error("Muted autoplay also failed:", e);
                        });
                    });
                }
            }

            // Attempt playback on metadata loaded and on DOM ready
            player.addEventListener('loadedmetadata', attemptAutoplay);
            document.addEventListener('DOMContentLoaded', attemptAutoplay);
            setTimeout(attemptAutoplay, 200);

            // Click banner to unmute
            unmuteBanner.addEventListener('click', () => {
                player.muted = false;
                unmuteBanner.style.display = 'none';
            });

            // Playback Speed Toggle (1x -> 1.25x -> 1.5x -> 2x -> 0.75x -> 1x)
            const speeds = [1, 1.25, 1.5, 2, 0.75];
            let currentSpeedIndex = 0;
            speedBtn.addEventListener('click', () => {
                currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
                const spd = speeds[currentSpeedIndex];
                player.playbackRate = spd;
                speedBtn.textContent = spd + 'x Speed';
            });

            // Fullscreen
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    player.requestFullscreen().catch(err => alert("Error enabling full-screen"));
                } else {
                    document.exitFullscreen();
                }
            });

            // Copy Link
            copyShareBtn.addEventListener('click', () => {
                navigator.clipboard.writeText(window.location.href).then(() => {
                    toast.className = "show";
                    setTimeout(() => { toast.className = ""; }, 2500);
                });
            });
        })();
    </script>
</body>
</html>
